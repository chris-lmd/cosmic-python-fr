site_name: "Patterns d'Architecture en Python"
site_description: "Guide francophone des patterns d'architecture logicielle en Python"
site_url: ""
repo_url: https://github.com/chris-lmd/cosmic-python-fr
repo_name: chris-lmd/cosmic-python-fr

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - toc.follow

nav:
  - Accueil: index.md
  - "Chapitre 0 - Mise en route": chapitre_00_mise_en_route.md
  - "Partie 1 - Construire l'architecture brique par brique":
    - "Chapitre 1 - Le modèle de domaine": partie1/chapitre_01_modele_domaine.md
    - "Chapitre 2 - Agrégats et frontières de cohérence": partie1/chapitre_02_aggregats.md
    - "Chapitre 3 - Le pattern Repository": partie1/chapitre_03_repository.md
    - "Chapitre 4 - La Service Layer": partie1/chapitre_04_service_layer.md
    - "Chapitre 5 - Le pattern Unit of Work": partie1/chapitre_05_unit_of_work.md
    - "Chapitre 6 - Couplage et abstractions": partie1/chapitre_06_abstractions.md
  - "Partie 2 - Architecture événementielle":
    - "Chapitre 7 - Domain Events": partie2/chapitre_07_events.md
    - "Chapitre 8 - Commands vs Events": partie2/chapitre_08_commands.md
    - "Chapitre 9 - Le Message Bus": partie2/chapitre_09_message_bus.md
    - "Chapitre 10 - Bootstrap et injection de dépendances": partie2/chapitre_10_bootstrap_di.md
    - "Chapitre 11 - TDD à haute et basse vitesse": partie2/chapitre_11_tdd.md
    - "Chapitre 12 - CQRS": partie2/chapitre_12_cqrs.md
    - "Chapitre 13 - Events externes": partie2/chapitre_13_events_externes.md
  - "Épilogue": epilogue.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true

extra:
  social: []
